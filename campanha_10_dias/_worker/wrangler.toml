name = "campanha-stats"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true  # URL alternativa <name>.<account>.workers.dev

# Custom domain — campanha-stats.datafixers.org
routes = [
  { pattern = "campanha-stats.datafixers.org", custom_domain = true }
]

[[kv_namespaces]]
binding = "ANALYTICS"
id = "c5f37c78e18642258bff4539dc675544"

# Secrets (defina via wrangler secret put):
#   wrangler secret put OWNER_KEY  ← obrigatório (proteção do /dashboard)
#   wrangler secret put TG_TOKEN   ← opcional (alertas Telegram)
#   wrangler secret put TG_CHAT    ← opcional (alertas Telegram)
