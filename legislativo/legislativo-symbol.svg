<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="title desc">
<title id="title">Robô do Datafixers lendo projetos no plenário</title>
<desc id="desc">O robô verde do Datafixers examina papéis em uma mesa, cercado por parlamentares em bancadas semicirculares.</desc>
<g fill="none" stroke="#1a1f1f" stroke-linecap="round" stroke-linejoin="round">
<!-- Parliamentary benches in two concentric arcs. -->
<path d="M26 114Q38 28 180 22Q322 28 334 114" stroke="#9fc9c2" stroke-width="17"/>
<path d="M49 127Q64 61 180 56Q296 61 311 127" stroke="#dbe2e0" stroke-width="14"/>
<!-- Four anonymous members, all drawn in the same style. -->
<g fill="#1a1f1f" stroke-width="2.5">
<circle cx="63" cy="72" r="12" fill="#f3f0e8"/><path d="M44 109V99Q44 88 63 88Q82 88 82 99V109Z"/>
<circle cx="117" cy="40" r="12" fill="#f3f0e8"/><path d="M98 77V67Q98 56 117 56Q136 56 136 67V77Z"/>
<circle cx="243" cy="40" r="12" fill="#f3f0e8"/><path d="M224 77V67Q224 56 243 56Q262 56 262 67V77Z"/>
<circle cx="297" cy="72" r="12" fill="#f3f0e8"/><path d="M278 109V99Q278 88 297 88Q316 88 316 99V109Z"/>
</g>
<!-- Desks keep the scene recognisable at small sizes. -->
<path d="M32 111L90 111M90 79L144 79M216 79L270 79M270 111L328 111" stroke="#1a1f1f" stroke-width="6"/>
<!-- Original Datafixers head, visor and antenna proportions. -->
<path d="M180 68V80" stroke-width="3"/>
<circle cx="180" cy="64" r="4" fill="#b4d7d1" stroke-width="2"/>
<rect x="152" y="80" width="56" height="42" rx="9" fill="#b4d7d1" stroke-width="2.5"/>
<rect x="148" y="92" width="4" height="16" rx="1" fill="#1a1f1f" stroke="none"/>
<rect x="208" y="92" width="4" height="16" rx="1" fill="#1a1f1f" stroke="none"/>
<rect x="158" y="88" width="44" height="20" rx="3" fill="#1a1f1f" stroke="none"/>
<g fill="#b4d7d1" stroke="none"><circle cx="170" cy="100" r="2.4"/><circle cx="190" cy="100" r="2.4"/></g>
<path d="M160 123Q180 116 200 123L210 157H150Z" fill="#b4d7d1" stroke-width="2.5"/>
<path d="M157 130L141 151M203 130L219 151" stroke-width="8"/>
<!-- Reading desk and stacked bills. -->
<path d="M98 172L126 150H234L262 172Z" fill="#dbe2e0" stroke-width="2.5"/>
<path d="M98 172H262V185H98Z" fill="#b4d7d1" stroke-width="2.5"/>
<path d="M113 185V206M247 185V206" stroke-width="5"/>
<g transform="rotate(-9 178 147)">
<path d="M151 116H197L211 130V167H151Z" fill="#f3f0e8" stroke-width="2.5"/>
<path d="M197 116V130H211" stroke-width="2"/>
<path d="M162 136H198M162 145H198M162 154H188" stroke="#6c7e77" stroke-width="2.5"/>
<path d="M162 127H181" stroke="#dc7850" stroke-width="3"/>
</g>
<circle cx="144" cy="151" r="5" fill="#b4d7d1" stroke-width="2"/>
<circle cx="216" cy="151" r="5" fill="#b4d7d1" stroke-width="2"/>
<path d="M226 154L248 150L255 160L231 164Z" fill="#f3f0e8" stroke-width="2"/>
<path d="M229 168L255 164" stroke-width="2"/>
</g></svg>
