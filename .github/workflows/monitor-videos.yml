name: Atualizar monitor de vídeos
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Coletar métricas e comentários públicos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          REQUIRE_DATA: '1'
        run: python3 scripts/update_video_monitor.py
      - name: Salvar histórico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor-videos/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza métricas diárias dos vídeos'
            git push
          fi
      - name: Publicar painel no Datafixers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=datafixers --branch=main
